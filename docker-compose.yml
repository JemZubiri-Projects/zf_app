version: "3.9"

services:
  web:
    build: .
    command: gunicorn zf_app.wsgi:application --bind 0.0.0.0:8000 --workers 2
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - static_volume:/app/staticfiles
    restart: unless-stopped

  db:
    image: mysql:8.0
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static
    depends_on:
      - web
    restart: unless-stopped

volumes:
  mysql_data:
  static_volume: