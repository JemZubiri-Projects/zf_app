{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/sidebar.css' %}">

<div class="zf-dashboard-layout">

    {% include "dashboard/_sidebar.html" %}

    <main class="dashboard-main">
        <h1 class="dashboard-title">Dashboard</h1>

        <div class="dashboard-widgets">
            <div class="widget-card">
                <h2>Inbox</h2>
                <p>{{ inbox_count }} messages</p>
            </div>

            <div class="widget-card">
                <h2>Outbox</h2>
                <p>{{ outbox_count }} messages</p>
            </div>

            <div class="widget-card">
                <h2>Applications</h2>
                <p>Access applications here.</p>
            </div>
        </div>

    </main>

</div>
{% endblock %}
