{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}ZF{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    <link rel="stylesheet" href="{% static 'css/typography.css' %}">
</head>

<body>
    <header class="app-header">
        <div class="header-left">
            <h2 class="app-title">ZF</h2>
        </div>

        {% if user.is_authenticated %}
        <div class="header-right">
            <span class="header-welcome">Welcome, {{ user.username }}</span>
            <a href="{% url 'accounts:logout' %}" class="header-logout">Logout</a>
        </div>
        {% endif %}
    </header>

    <main class="app-content">
        {% block content %}{% endblock %}
    </main>
</body>

</html>
